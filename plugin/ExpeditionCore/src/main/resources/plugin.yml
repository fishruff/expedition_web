name: ExpeditionCore
version: 0.1.0
main: ru.fishruff.expedition.ExpeditionCore
api-version: '1.21'

author: fish_ruff

description: Core plugin for Expedition survival server

commands:
  expedition:
    description: Состояние обмена с api
    usage: /expedition [status|flush]
    permission: expedition.admin
  note:
    description: Опубликовать подписанную книгу в дневнике экспедиции
    usage: /note [draft]
    permission: expedition.note
  love:
    description: Привет одному человеку
    usage: /love
    permission: expedition.love

permissions:
  expedition.admin:
    description: Команды оператора экспедиции
    default: op
  expedition.note:
    description: Публикация записей книгой
    default: true
  # Узел объявлен не ради ограничения, а ради возможности его снять: без него
  # команду нельзя ни выключить, ни отдать кому-то одному — LuckPerms не за что
  # взяться. Поставьте `op`, если она должна остаться только у своих.
  expedition.love:
    description: Личное приветствие
    default: true
