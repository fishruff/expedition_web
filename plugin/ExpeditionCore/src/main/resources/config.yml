# Настройка ExpeditionCore.
# Файл создаётся при первом запуске в plugins/ExpeditionCore/config.yml
# и дальше правится там — здесь лежит только образец по умолчанию.
#
# Ключа здесь нет и не будет: он берётся из переменной окружения EXPEDITION_KEY.
# Секрету не место в файле, который уезжает в репозиторий и в архив с бэкапом.
# Ключ обязан быть из латиницы и цифр — заголовки HTTP не переносят кириллицу,
# и плагин с таким ключом просто не включится.

api:
  # Внутри докерной сети это имя сервиса, на своей машине — localhost.
  url: "http://api:4000/events"
  timeoutSeconds: 10

# Сигнал «сервер жив». api считает сервер выключенным после трёх минут тишины,
# так что запас здесь двойной.
heartbeatSeconds: 60

# Как часто снимать статистику с тех, кто в сети.
statsMinutes: 5

# Как часто обходить инвентари в поисках находок.
sweepSeconds: 5
